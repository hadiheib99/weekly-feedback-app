{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pulse — private weekly project health feedback.">
  <title>{% block title %}Pulse{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'feedback/styles.css' %}">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="{% url 'home' %}" style="color:inherit;text-decoration:none"><span class="brand-mark"></span><span>Pulse</span></a>
      {% if user.is_authenticated %}
        <nav class="preview-nav"><a href="{% url 'dashboard' %}" class="active">Dashboard</a><a href="{% url 'logout' %}">Sign out</a></nav>
        <div class="avatar">{{ user.username|slice:':2'|upper }}</div>
      {% else %}<a class="outline-btn" href="{% url 'login' %}" style="text-decoration:none">Team sign in</a>{% endif %}
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
